[package]
name = "snowfishemu-libretro"
description = "SnowFish/SFA application emulator - Libretro core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The cdylib is named after this target; the libretro buildbot and the
# release workflows rename it to snowfishemu_libretro.<ext> for RetroArch.
name = "snowfishemu"
crate-type = ["cdylib", "staticlib"]
path = "src/lib.rs"

[dependencies]
snowfishemu-core.workspace = true
anyhow.workspace = true
log.workspace = true
