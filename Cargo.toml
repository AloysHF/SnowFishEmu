[workspace]
resolver = "2"
members = [
    "crates/snowfishemu-core",
    "crates/snowfishemu",
    "crates/snowfishemu-libretro",
    "crates/snowfishemu-tools",
]
# The libretro buildbot runs a bare `cargo build --release --target <triple>` at
# the repo root. Restrict the default build set to the libretro core so the CI
# does not try to cross-compile the standalone GUI binary (minifb/rodio, which
# need X11/ALSA). Explicit `-p` / `--workspace` selections are unaffected.
default-members = ["crates/snowfishemu-libretro"]

[workspace.package]
version = "0.1.0"
edition = "2021"
description = "A SnowFish (SFA) application emulator written in Rust"
license = "BSD-3-Clause"

[workspace.dependencies]
snowfishemu-core = { path = "crates/snowfishemu-core" }
anyhow = "1"              # Error handling (ergonomic Result types)
thiserror = "2"           # Error handling (custom error enums)
log = "0.4"               # Logging facade
serde = { version = "1", features = ["derive"] }  # Save-state serialization
bincode = "1"             # Compact save-state binary encoding
armv4t_emu = { version = "0.1.3", features = ["serde-serialize"] }  # Pure Rust ARMv4T/Thumb interpreter
unifont = "1.1"           # Embedded Unicode bitmap font (text rendering)
clap = { version = "4", features = ["derive"] }  # CLI argument parsing (standalone)
minifb = "0.29"           # Window creation and pixel rendering (standalone)
env_logger = "0.11"       # Log output to stderr (standalone)

[profile.release]
opt-level = 3
lto = true
strip = true
